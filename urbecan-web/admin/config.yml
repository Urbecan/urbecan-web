# Panel de edición de Urbecan → /admin/ (Decap CMS + DecapBridge)
# Al publicar, Decap hace commit en GitHub y Netlify regenera la web (node scripts/build.mjs).

# Acceso con email y contraseña (o Google/Microsoft) vía DecapBridge, sin cuenta de GitHub.
# Bloque generado por https://decapbridge.com (sitio «Urbecan», auth PKCE).
# Usuarios e invitaciones se gestionan en DecapBridge.
backend:
  name: git-gateway
  repo: Urbecan/urbecan-web
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/836547a6-307e-4b5d-be1a-66e313f208c9/pkce
  auth_token_endpoint: /sites/836547a6-307e-4b5d-be1a-66e313f208c9/token
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: "Panel: crear {{collection}} «{{slug}}» ({{author-name}} <{{author-login}}>)"
    update: "Panel: actualizar {{collection}} «{{slug}}» ({{author-name}} <{{author-login}}>)"
    delete: "Panel: borrar {{collection}} «{{slug}}» ({{author-name}} <{{author-login}}>)"
    uploadMedia: "Panel: subir foto «{{path}}» ({{author-name}} <{{author-login}}>)"
    deleteMedia: "Panel: borrar foto «{{path}}» ({{author-name}} <{{author-login}}>)"

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# En local (localhost) usa el proxy de «npx decap-server» en lugar de DecapBridge
local_backend: true

locale: es

# Cambiar a https://www.urbecan.com al lanzar
site_url: https://urbecan.netlify.app
display_url: https://urbecan.netlify.app

logo:
  src: /assets/urbecan-logo-inmobiliaria.png
  show_in_header: true

media_folder: urbecan-web/assets/img/uploads
public_folder: /assets/img/uploads

# Nombres de archivo sin tildes ni espacios (residencial-mirador-del-valle.json)
slug:
  encoding: ascii
  clean_accents: true

collections:
  # ── Promociones: una ficha por archivo (data/promociones/*.json)
  - name: promociones
    label: Promociones
    label_singular: promoción
    description: Obra nueva en la página Profesionales / Promotores. Las marcadas como «Vendida» salen en «Promociones vendidas».
    folder: urbecan-web/data/promociones
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{nombre}}"
    identifier_field: nombre
    # Primera línea = etiqueta pequeña, segunda = nombre (estilos en admin/urbecan.css)
    summary: "{{estado}} · {{municipio}}\n{{nombre}}"
    sortable_fields:
      - { field: orden, label: Orden en la web, default_sort: asc }
      - { field: nombre, label: Nombre }
      - { field: anio, label: Año }
    view_filters:
      - { label: En venta, field: estado, pattern: "^(?!Vendida$)" }
      - { label: Vendidas, field: estado, pattern: "^Vendida$" }
    view_groups:
      - { label: Estado, field: estado }
    editor:
      preview: false
    fields:
      - { name: image, label: Foto principal, widget: image, choose_url: false, hint: "Formato horizontal. Es la foto de la tarjeta." }
      - { name: nombre, label: Nombre, widget: string }
      - { name: municipio, label: Municipio, widget: string }
      - { name: anio, label: Año, widget: number, value_type: int, required: false, hint: "En las vendidas se muestra junto al municipio (p. ej. «La Orotava · 2019»)." }
      - { name: viviendas, label: Nº de viviendas, widget: number, value_type: int, required: false }
      - { name: tipo, label: Tipo, widget: select, options: [viviendas, apartamentos, villas, dúplex, áticos, locales], default: viviendas }
      - { name: estado, label: Estado, widget: select, options: [En comercialización, Últimas unidades, Próximamente, Vendida], default: En comercialización }
      - { name: precio, label: Precio, widget: string, required: false, hint: "Tal cual se verá: «Desde 245.000 €», «Consultar»… Vacío = no se muestra. No se muestra en las vendidas." }
      - { name: descripcion, label: Descripción corta, widget: text, required: false, hint: "Una o dos frases (unos 120 caracteres). No se muestra en las vendidas." }
      - name: galeria
        label: Más fotos
        label_singular: foto
        widget: list
        collapsed: false
        required: false
        hint: Fotos adicionales del carrusel (solo promociones activas).
        field: { name: foto, label: Foto, widget: image, choose_url: false }
      - { name: enlace, label: Enlace externo, widget: string, required: false, hint: "Opcional. Web o ficha de la promoción (https://…). Añade el botón «Ver proyecto ↗»." }
      - { name: orden, label: Orden en la web, widget: number, value_type: int, default: 99, hint: "1 = primera. Las activas y las vendidas se ordenan cada una por este número." }

  # ── Equipo: una persona por archivo (data/equipo/*.json)
  - name: equipo
    label: Equipo
    label_singular: persona
    description: Equipo de la página Nosotros.
    folder: urbecan-web/data/equipo
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{nombre}}"
    identifier_field: nombre
    summary: "{{cargo}}\n{{nombre}}"
    sortable_fields:
      - { field: orden, label: Orden en la web, default_sort: asc }
      - { field: nombre, label: Nombre }
    editor:
      preview: false
    fields:
      - { name: image, label: Foto, widget: image, choose_url: false, hint: "Formato vertical, mismo encuadre para todo el equipo." }
      - { name: nombre, label: Nombre, widget: string }
      - { name: cargo, label: Cargo, widget: string, required: false }
      - { name: orden, label: Orden en la web, widget: number, value_type: int, default: 99, hint: "1 = primero." }

  # ── Textos: un archivo por página (data/textos/<página>.json)
  - name: textos
    label: Textos
    description: "Titulares y párrafos principales. *texto* = cursiva · [texto] = segundo tono (gris) · salto de línea = nueva línea."
    format: json
    editor:
      preview: false
    files:
      - name: inicio
        label: Inicio
        file: urbecan-web/data/textos/inicio.json
        fields:
          - { name: hero_linea1, label: Titular · línea 1, widget: string }
          - { name: hero_linea2, label: Titular · línea 2, widget: string, hint: "\\*texto\\* = cursiva" }
          - { name: hero_texto, label: Texto junto al titular, widget: text }
          - { name: intro_titulo, label: "01 · Titular", widget: text, hint: "[texto] = segundo tono (gris)" }
          - { name: intro_texto, label: "01 · Texto", widget: text }
          - { name: propiedades_texto, label: "02 · Propiedades · texto", widget: text }
          - { name: trayectoria_titulo, label: "04 · Trayectoria · titular", widget: text, hint: "Cada salto de línea se respeta." }
          - { name: trayectoria_texto, label: "04 · Trayectoria · texto", widget: text }
          - { name: cierre_titulo, label: "07 · Cierre · titular", widget: string }
      - name: nosotros
        label: Nosotros
        file: urbecan-web/data/textos/nosotros.json
        fields:
          - { name: titulo, label: Titular, widget: text, hint: "Salto de línea = nueva línea · \\*texto\\* = cursiva" }
          - { name: texto, label: Texto de entrada, widget: text }
          - { name: mirada, label: Nuestra mirada, widget: text, hint: "[texto] = segundo tono (gris)" }
          - { name: trayectoria_texto, label: Trayectoria · texto, widget: text }
          - { name: trayectoria_detalle, label: Trayectoria · detalle, widget: text }
          - { name: equipo_titulo, label: Equipo · titular, widget: string }
          - { name: equipo_intro, label: Equipo · introducción, widget: text }
      - name: particulares
        label: Particulares
        file: urbecan-web/data/textos/particulares.json
        fields:
          - { name: titulo, label: Titular, widget: text, hint: "Salto de línea = nueva línea · \\*texto\\* = cursiva" }
          - { name: texto, label: Texto de entrada, widget: text }
          - { name: comprar, label: Comprar, widget: text }
          - { name: vender, label: Vender, widget: text }
          - { name: invertir, label: Invertir, widget: text }
          - { name: cita, label: Cita destacada, widget: text }
      - name: profesionales
        label: Profesionales / Promotores
        file: urbecan-web/data/textos/profesionales.json
        fields:
          - { name: titulo, label: Titular, widget: text, hint: "Salto de línea = nueva línea · \\*texto\\* = cursiva" }
          - { name: texto, label: Texto de entrada, widget: text }
          - { name: manifiesto_titulo, label: Manifiesto · titular, widget: string }
          - { name: manifiesto_texto, label: Manifiesto · texto, widget: text }
          - { name: promos_titulo, label: Promociones activas · titular, widget: string, hint: "\\*texto\\* = cursiva" }
          - { name: promos_texto, label: Promociones activas · texto, widget: text }
          - { name: promos_nota, label: Promociones activas · nota, widget: string, required: false, hint: Vacío = no se muestra. }
          - { name: vendidas_titulo, label: Vendidas · titular, widget: string, hint: "\\*texto\\* = cursiva" }
          - { name: vendidas_texto, label: Vendidas · texto, widget: text }
          - { name: vendidas_nota, label: Vendidas · nota, widget: string, required: false, hint: Vacío = no se muestra. }
